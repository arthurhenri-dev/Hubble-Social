<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hubble</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:ital,wght@0,100..900;1,100..900&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <img src="pngs/hubble.png" alt="Logo do Hubble">
        <h2 class="fonte">hubb<span class="gradiente-logo">le</span></h2>
    </header>

    <div class="login">
        <h1>Cadastro</h1>

        <input type="text" class="caixa-texto" id="nome" placeholder="Digite seu nome completo"/>
        <input type="date" class="caixa-texto" id="nascimento" placeholder="Data de nascimento"/>
        <input type="text" class="caixa-texto" id="email" placeholder="seuemail@exemplo.com"/>
        <input type="password" class="caixa-texto" id="senha" placeholder="Crie uma senha"/>

        <button id="btnCadastrar">Criar conta</button>

        <h4 class="cadastro-texto">
            Já possui uma conta? 
            <a href="login.html" class="cadastro-link">Faça login</a>
        </h4>
    </div>

    <script src="script.js"></script>
</body>

</html>

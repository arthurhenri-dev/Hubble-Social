<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hubble</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <img src="hubble.png"/>
        <h2 class="fonte" >hubble</h2>
    </header>

    <div class="login">
        <h1>Cadastro</h1>

        <input type="text" class="caixa-texto" id="nome" placeholder="Digite seu nome completo"/>
        <input type="date" class="caixa-texto" id="nascimento" placeholder="Data de nascimento"/>
        <input type="text" class="caixa-texto" id="email" placeholder="Digite seu email"/>
        <input type="password" class="caixa-texto" id="senha" placeholder="Crie uma senha"/>

        <button id="btnCadastrar">Criar conta</button>

        <h4 class="cadastro-texto">
            Já possui uma conta? 
            <a href="index.html" class="cadastro-link">Faça login</a>
        </h4>
    </div>

    <script src="script.js"></script>
</body>

</html>
